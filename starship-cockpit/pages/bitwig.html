<!doctype html><html><head><meta charset="utf-8"><title>Bitwig hologram</title>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><script src="ship.js"></script><script>
// A hologram of the Bitwig session, raised from the dash projector. The centre screen
// links up, the projector lights, and a large panel rises over the windscreen. The
// Bitwig window capture goes under this layer at x 600, y 84, 720 x 405, blended
// "screen" with a cyan colour correction, fading in after 1100 ms. The panel's border
// and the meter strip under it follow the music. Transparent.
const x=document.getElementById('c').getContext('2d');
const P={x:600,y:84,w:720,h:405},SRC={x:960,y:470},SCR=[843,531,317,167],HC=CYAN;
run((s,t)=>{const a=audio(s);x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);applySway(x,s);
 // 1. the centre screen links to the DAW
 const sa=t<120?t/120:t<1100?1:Math.max(0,1-(t-1100)/250);
 if(sa>0){const [sx,sy,sw,sh]=SCR;x.save();x.globalAlpha=sa;x.fillStyle='#030a0d';x.fillRect(sx,sy,sw,sh);
  x.fillStyle=`rgba(${HC},.95)`;x.font='700 21px "JetBrains Mono",Consolas,monospace';x.textAlign='center';x.fillText('LINKING AUDIO BRIDGE',sx+sw/2,sy+62);
  x.font='500 14px "JetBrains Mono",Consolas,monospace';x.fillStyle=`rgba(${HC},.75)`;x.fillText('BITWIG STUDIO  ·  LIVE SET',sx+sw/2,sy+92);
  for(let i=0;i<24;i++){const v=a.bands[i]*cl(t/600);x.fillRect(sx+40+i*10,sy+140-30*v,6,30*v)}
  for(let y=sy;y<sy+sh;y+=3){x.fillStyle='rgba(0,0,0,.2)';x.fillRect(sx,y,sw,1)}x.restore()}
 // 2. projector, beam and panel
 const on=cl((t-700)/300);if(on<=0)return;
 x.globalCompositeOperation='lighter';const fl=(.88+.12*Math.sin(t/37)*Math.sin(t/91))*(.85+.25*a.kick);
 let g=x.createRadialGradient(SRC.x,SRC.y,0,SRC.x,SRC.y,80);g.addColorStop(0,`rgba(${HC},${.85*on})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(SRC.x-80,SRC.y-80,160,160);
 const rise=ss(850,1350,t),top=P.y+P.h*(1-rise);
 g=x.createLinearGradient(0,SRC.y,0,top);g.addColorStop(0,`rgba(${HC},${.2*on*fl})`);g.addColorStop(1,`rgba(${HC},${.04*on*fl})`);
 x.fillStyle=g;x.beginPath();x.moveTo(SRC.x-22,SRC.y);x.lineTo(P.x,P.y+P.h);x.lineTo(P.x+P.w,P.y+P.h);x.lineTo(SRC.x+22,SRC.y);x.closePath();x.fill();
 if(rise>0){x.save();x.beginPath();x.rect(P.x,top,P.w,P.y+P.h-top);x.clip();
  x.fillStyle=`rgba(${HC},${.04*fl})`;x.fillRect(P.x,P.y,P.w,P.h);
  for(let y=P.y;y<P.y+P.h;y+=3){x.fillStyle=`rgba(${HC},.05)`;x.fillRect(P.x,y,P.w,1)}
  const sy=P.y+((t*.22)%P.h);g=x.createLinearGradient(0,sy-36,0,sy+36);g.addColorStop(0,`rgba(${HC},0)`);g.addColorStop(.5,`rgba(${HC},.1)`);g.addColorStop(1,`rgba(${HC},0)`);x.fillStyle=g;x.fillRect(P.x,sy-36,P.w,72);
  if(hash(Math.floor(t/90))>.94){x.fillStyle=`rgba(${HC},.22)`;x.fillRect(P.x,P.y+hash(Math.floor(t/90)+3)*P.h,P.w,3)}
  x.restore();
  x.strokeStyle=`rgba(${HC},${(.45+.4*a.kick)*fl})`;x.lineWidth=1.5+1.5*a.kick;x.strokeRect(P.x+.5,top+.5,P.w-1,P.y+P.h-top-1);
  for(const [cx,cy,dx,dy] of [[P.x,top,1,1],[P.x+P.w,top,-1,1],[P.x,P.y+P.h,1,-1],[P.x+P.w,P.y+P.h,-1,-1]]){x.lineWidth=3;x.beginPath();x.moveTo(cx+dx*30,cy);x.lineTo(cx,cy);x.lineTo(cx,cy+dy*30);x.stroke()}
  x.fillStyle=`rgba(255,255,255,${.7*Math.max(0,1-Math.abs(rise-.98)*4)})`;x.fillRect(P.x,top-1,P.w,3)}
 // 3. a meter strip along the panel's foot, and the caption above it
 x.globalCompositeOperation='lighter';const ca=cl((t-1500)/400);
 if(ca>0){x.globalAlpha=ca;const by=P.y+P.h-6;for(let i=0;i<48;i++){const v=a.bands[Math.floor(i*32/48)];x.fillStyle=`rgba(${HC},${.15+.5*v})`;x.fillRect(P.x+8+i*((P.w-16)/48)+1,by-26*v,(P.w-16)/48-2,Math.max(2,26*v))}
  x.globalCompositeOperation='source-over';x.font='600 15px "JetBrains Mono",Consolas,monospace';x.fillStyle=`rgba(${HC},.9)`;x.textAlign='left';x.fillText('BITWIG STUDIO  ·  LIVE SET',P.x,P.y-12);
  x.textAlign='right';x.fillText(`${BPM} BPM  ·  BAR ${Math.floor(a.beat/4)%16+1}  ${a.beat%4==0?'●':'○'}`,P.x+P.w,P.y-12);x.globalAlpha=1}
 x.globalCompositeOperation='source-over'
});
</script></body></html>
